
  <!DOCTYPE html>
  <html lang="pt-BR">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
      <link rel="icon" type="image/svg+xml" href="/student-project-dashboard/favicon.svg" />
      <title>Student Dashboard</title>
      <link rel="manifest" href="/manifest.json" />
      <meta name="theme-color" content="#0F766E" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-title" content="Companion" />
      <style>
        html, body { height: 100%; margin: 0; }
        #root { height: 100%; }
      </style>
    </head>

    <body>
      <div id="root"></div>
      <script>
        window.installPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          window.installPrompt = e;
        });
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/student-project-dashboard/sw.js', { scope: '/student-project-dashboard/' });
        }
      </script>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
